<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Distribuidora Éxodo</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/logo.png" alt="Distribuidora Éxodo" style="height: 45px; object-fit: contain;">
            <span>Distribuidora Éxodo</span>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <nav id="menu">
            <a href="index.html">🏠 Inicio</a>
            <a href="frutas.html">🍎 Frutas</a>
            <a href="verduras.html">🥕 Verduras</a>
            <a href="granos.html">🌽 Granos</a>
            <a href="lacteos.html">🥛 Lácteos</a>
            <a href="canastas.html">🧺 Canastas</a>
            <a href="carrito.html" class="carrito-menu">🛒 Carrito</a>
        </nav>
    </header>

    <main class="productos-page">
        <h1>🛒 Mi Carrito de Compras</h1>
        <div class="carrito-layout">
            <div>
                <div id="lista-carrito"></div>
            </div>
            <div class="resumen-card">
                <h2>Resumen del Pedido</h2>
                <p style="font-size: 15px; margin-bottom: 15px;">Total a pagar: <strong>$<span id="total-carrito-txt">0.00</span></strong></p>
                
                <div class="metodo-pago">
                    <p style="font-weight: bold; margin-bottom: 8px; font-size: 14px;">Método de Pago:</p>
                    <label><input type="radio" name="pago" value="Efectivo" checked> Efectivo al recibir</label>
                    <label><input type="radio" name="pago" value="Transferencia Bancaria"> Transferencia bancaria</label>
                    <label><input type="radio" name="pago" value="Cheque"> Cheque</label>
                </div>

                <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">
                    📲 Enviar pedido por WhatsApp
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Distribuidora Éxodo. Todos los derechos reservados.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        mostrarCarrito();
    </script>
</body>
</html>
