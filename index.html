<script>
        // Tus credenciales configuradas
        const SUPABASE_URL = 'https://kwfqjieynfxxkfycqbom.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_v2RhsMkjIcNdz2FS1SIqug_9OGu3L2k'; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Función auxiliar para renderizar tarjetas en un grid específico
        function renderizarProductos(productos, elementId) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';

            if (productos.length === 0) {
                grid.innerHTML = '<p>No hay productos disponibles en esta sección.</p>';
                return;
            }

            productos.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${prod.nombre}</h3>
                    <div class="price">$${Number(prod.precio).toFixed(2)}</div>
                    <div class="stock">Disponibilidad: <strong>${prod.stock}</strong> unidades</div>
                `;
                grid.appendChild(card);
            });
        }

        // Función para cargar y separar el inventario por categorías desde Supabase
        async function cargarInventario() {
            const { data, error } = await supabaseClient
                .from('productos')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Error al cargar el catálogo:', error);
                document.getElementById('grid-verduras').innerHTML = '<p>Error al cargar el catálogo.</p>';
                document.getElementById('grid-lacteos').innerHTML = '<p>Error al cargar el catálogo.</p>';
                return;
            }

            const verduras = data.filter(p => p.categoria && p.categoria.toLowerCase() === 'verdura');
            const lacteos = data.filter(p => p.categoria && p.categoria.toLowerCase() === 'lacteo');

            renderizarProductos(verduras, 'grid-verduras');
            renderizarProductos(lacteos, 'grid-lacteos');
        }

        // Cargar al abrir la página
        cargarInventario();
    </script>
